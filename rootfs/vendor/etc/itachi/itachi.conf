# ITACHI HAL config (duchamp). Lines starting with # are ignored.
trace=1
doze_node=/sys/class/mi_display/disp-DSI-0/doze_brightness
maxbr_node=/sys/class/mi_display/disp-DSI-0/factory_max_brightness
panel_info_node=/sys/class/mi_display/disp-DSI-0/panel_info
# Leave empty to auto-detect under /sys/class/touch/touch_dev/ (see logcat -s itachi-hal)
#dt2w_node=/sys/class/touch/touch_dev/<node>
# ColorOS AOD value (index 0..7) -> Xiaomi doze_brightness (0 normal, 1 high, 2 low)
aod_map=0,1,2,2,2,2,2,2
default_maxbr=2047

# ---- FOD / SOFOD (phase 2) ----
# Value for ColorOS panel feature 211 (UDFPS type). 0x410 = local HBM capable. Verify in your services.jar.
udfps_type=0x410
# Raw value ColorOS sends for "finger layer show" on feature 20004/28 (1 normal, 0 if inverted)
layer_show_val=1
# Touch IC FOD enable node candidates (first existing one is used)
# duchamp has NO fod_enable sysfs node (checked in your vendor). FOD touch is armed through Xiaomi ITouchFeature.
fod_nodes=
backlight_node=/sys/class/mi_display/disp-DSI-0/backlight
# Touch input device: name substring from /proc/bus/input/devices, or explicit path
touch_name=touch
#touch_path=/dev/input/event3
# Screen counts as OFF when backlight <= this (raise if AOD keeps a small backlight)
screen_off_bl_max=0
# SOFOD hint: how long panel stays lit after a screen-off touch, and which doze value lights it
hint_enable=1
hint_ms=7000
hint_doze=1

# ---- FOD arm through ITouchFeature (needs verified values from the vendor lib, see README) ----
# fod_arm=0: ITACHI does not arm; Xiaomi mfp-daemon (FodEngine) is trusted to do it. Set 1 only if logs show FOD touch is not armed.
fod_arm=0
touch_service=vendor.xiaomi.hw.touchfeature.ITouchFeature/default
# VERIFIED from your vendor.xiaomi.hw.touchfeature-V1-ndk.so: setModeValue = txn 9, getModeCurValue = 1, getModeCurValueString = 10
touch_txn_set=9
touch_dev_id=0
touch_mode_fod=10
touch_arm_val=1
