# ITACHI - builds out/itachi-hal on GitHub (NDK preinstalled). Commit hal/itachi_sealed.h + license.lic (both public-safe).
# NEVER commit itachi_private.key. (c) @yooitachiijod
name: build-itachi-hal
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          chmod +x build_all.sh && ./build_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: itachi-hal
          path: |
            out/itachi-hal
            out/license.lic
