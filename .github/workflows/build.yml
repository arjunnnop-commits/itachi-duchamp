name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Locate NDK (preinstalled on GitHub runners)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          ls "$NDK/build/cmake/android.toolchain.cmake"

      - name: License secret
        env:
          OWNER_SECRET: ${{ secrets.ITACHI_SECRET_HEX }}
        run: |
          # Put a 64-hex-char secret in the repo secret ITACHI_SECRET_HEX to keep the same license across builds.
          # If it is missing, a random one is generated for this build (and the matching itachi.lic is shipped).
          SECRET="${OWNER_SECRET:-$(openssl rand -hex 32)}"
          echo "::add-mask::$SECRET"
          echo "ITACHI_SECRET_HEX=$SECRET" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DITACHI_SECRET_HEX="$ITACHI_SECRET_HEX"

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          mkdir -p out/odm/bin/hw out/odm/etc/init out/odm/etc/vintf/manifest out/odm/etc/selinux
          cp build/itachid out/odm/bin/hw/itachid
          python3 tools/make_license.py "$ITACHI_SECRET_HEX" > out/odm/etc/itachi.lic
          cp init/itachid.rc out/odm/etc/init/itachid.rc
          cp config/itachi.conf out/odm/etc/itachi.conf
          cp vintf/itachid.xml out/odm/etc/vintf/manifest/itachid.xml
          cp -r sepolicy out/sepolicy-snippets
          mkdir -p out/props out/tools && cp props/* out/props/ && cp tools/* out/tools/
          cp README.md out/

      - name: Build overlay APK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          AJ=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)/android.jar
          mkdir -p ov out/odm/overlay
          "$BT/aapt2" compile --dir overlay/DuchampOverlay/res -o ov/res.zip
          "$BT/aapt2" link -o ov/unsigned.apk -I "$AJ" --min-sdk-version 30 --target-sdk-version 34 \
            --manifest overlay/DuchampOverlay/AndroidManifest.xml ov/res.zip
          "$BT/zipalign" -f 4 ov/unsigned.apk ov/aligned.apk
          keytool -genkeypair -keystore ov/ks.jks -storepass android -keypass android -alias k \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=itachi"
          "$BT/apksigner" sign --ks ov/ks.jks --ks-pass pass:android --out out/odm/overlay/DuchampOverlay.apk ov/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: itachi-duchamp-arm64
          path: out/
