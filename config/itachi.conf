# itachid configuration. Installed as /odm/etc/itachi.conf. "#" starts a comment.

# Log every get/set/info/extCmd call to logcat (tag: itachid). Keep on while bringing up.
probe = 1

# ---- Capability word read from feature 211 (verified in this ROM's SystemUI + services.jar) ----
#   -1            : unsupported
#   bit 4  (16)   : local HBM          -> SystemUI isLocalHBM = true (no dim layer / black box)
#   bit 10 (1024) : local-HBM accel    -> SystemUI isLocalHBMAccel; services.jar then calls set(28,v)
#   bit 2  (4)    : HW dimlayer        -> services.jar routes set(28,v) to us only (skips SurfaceFlinger)
# 0x410 = 16 | 1024
cap211 = 0x410

# ---- Fingerprint (Goodix FOD) ----
# FOD centre in display pixels, and the display->touch coordinate scale
# (HiOS log: raw x~980,y~3900 for a finger on the sensor => ~1.6x).
fod_center_x = 609
fod_center_y = 2437
touch_scale = 1.6
# fod_x_raw = 0      # uncomment to give raw values directly
# fod_y_raw = 0
# When is "spot ready" (extCmd 10,1) sent?
#   hbm   : when SystemUI calls set(22,[1]) (it lights the icon)   [default]
#   press : a fixed delay after set(28,[1])
ready_mode = hbm
hbm_ready_delay_ms = 20   # ready_mode=hbm
ready_delay_ms = 60       # ready_mode=press
# Send extCmd(1,1)/(1,0) finger markers like the original framework did.
send_finger_cmd = 1
# If mfp-daemon does NOT light local HBM by itself, set the Xiaomi display-feature
# "mode" number for LHBM here (>=0 enables IDisplayFeature::setFeature(0,mode,1|0,cookie)).
lhbm_mode = -1
lhbm_cookie = 0

# ---- AOD ----
# doze_brightness values to test by hand first:  echo N > <node>
aod_on_value = 1
aod_off_value = 0
# Feature 7 is an "AOD light mode" number, not on/off. Calibrate from the log lines `set(7,[n])`:
# aod_map = 0:2,1:1,2:1      # <mode>:<doze_brightness value>
# aod_nodes = /sys/class/mi_display/disp_feature/disp-DSI-0/doze_brightness,/sys/class/drm/card0-DSI-1/doze_brightness
touch_aod_node = /sys/devices/platform/goodix_ts.0/aod_enable

# ---- Generic answers for get() on feature IDs we do not implement ----
get_default = 0
# get.<id> = v0,v1,...     e.g.  get.8 = 2047
# info.<id> = str1,str2
